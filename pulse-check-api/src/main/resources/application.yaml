server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pulse-check-api
  
  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000
          ssl:
            trust: smtp.gmail.com
            enable: false
          socketFactory:
            port: 587
            fallback: true
    from: "mabel.ewurabenah@gmail.com"
    test-connection: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulse_check}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:DEBUG}
    com.mabel: ${LOG_LEVEL_COM_MABEL:DEBUG}
    root: ${LOG_LEVEL_ROOT:INFO}
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n]"

# Custom Application Configuration
pulse-check:
  timer:
    check-interval-ms: ${TIMER_CHECK_INTERVAL_MS:1000}
  alert:
    interval-seconds: ${ALERT_INTERVAL_SECONDS:60}
    max-retries: ${MAX_EMAIL_RETRIES:3}
  validation:
    monitor-id-min-length: ${MONITOR_ID_MIN_LENGTH:3}
    monitor-id-max-length: ${MONITOR_ID_MAX_LENGTH:50}
    monitor-timeout-min-seconds: ${MONITOR_TIMEOUT_MIN_SECONDS:30}
    monitor-timeout-max-seconds: ${MONITOR_TIMEOUT_MAX_SECONDS:86400}
