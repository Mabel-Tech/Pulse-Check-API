server:
  port: 8081

spring:
  application:
    name: pulse-check-api
  
  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000
          ssl:
            trust: smtp.gmail.com
            enable: false
          socketFactory:
            port: 587
            fallback: true
    from: noreply@pulsecheck.com
    test-connection: false

  datasource:
    url: jdbc:postgresql://localhost:5432/pulse_check
    username: postgres
    password: MabelTech
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.web: DEBUG
    com.mabel: DEBUG
    root: INFO
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
